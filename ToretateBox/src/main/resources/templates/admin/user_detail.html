<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ユーザー詳細 | とれたてBOX</title>

  <link rel="stylesheet" th:href="@{/css/admin/user_detail.css}">
</head>

<body class="user-detail-page">

<div th:replace="~{layout/layout :: layout(~{::title}, ~{::content})}">

  <main th:fragment="content" class="container py-5">

    <h2 class="page-title">ユーザー詳細</h2>

    <div class="detail-wrap mx-auto">

      <div class="table-responsive">
        <table class="table detail-table mb-0">
          <tbody>
            <tr>
              <th th:text="#{label.admin.user.emailId}">メールアドレス(ID)</th>
              <td th:text="${user.email}"></td>
            </tr>

            <tr>
              <th th:text="#{label.admin.user.name}">ユーザー名</th>
              <td th:text="${user.name}"></td>
            </tr>

            <tr>
              <th th:text="#{label.admin.user.nameKana}">フリガナ</th>
              <td th:text="${user.nameKana}"></td>
            </tr>

            <tr>
              <th th:text="#{label.admin.user.phone}">電話番号</th>
              <td th:text="${user.phoneNumber}"></td>
            </tr>

            <tr>
              <th th:text="#{label.admin.user.postal}">郵便番号</th>
              <td th:text="${postalCode}"></td>
            </tr>

            <tr>
              <th th:text="#{label.admin.user.prefecture}">都道府県</th>
              <td th:text="${addr != null ? addr.prefecture : 'なし'}"></td>
            </tr>

            <tr>
              <th th:text="#{label.admin.user.city}">市区町村</th>
              <td th:text="${addr != null ? addr.city : 'なし'}"></td>
            </tr>

            <tr>
              <th th:text="#{label.admin.user.address1}">町名・番地</th>
              <td th:text="${addr != null ? addr.addressLine1 : 'なし'}"></td>
            </tr>

            <tr>
              <th th:text="#{label.admin.user.address2}">建物名・部屋番号</th>
              <td th:text="${addr != null && addr.addressLine2 != null && !addr.addressLine2.isEmpty() 
                             ? addr.addressLine2 : 'なし'}"></td>
            </tr>

            <tr>
              <th th:text="#{label.admin.user.createdAt}">登録日</th>
              <td th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd')}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="btn-group mt-5">

      <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
            method="post"
            th:onsubmit="|return confirm('${#messages.msg('message.confirm.delete')}');|"
            class="m-0">

        <input type="hidden"
               th:name="${_csrf?.parameterName}"
               th:value="${_csrf?.token}" />

        <button type="submit" class="common-btn btn-red">削除</button>
      </form>

      <a th:href="@{/admin/users}" class="common-btn btn-blue">戻る</a>

    </div>

  </main>
</div>

</body>
</html>
